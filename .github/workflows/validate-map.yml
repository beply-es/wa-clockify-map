name: Validate map

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: validate-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Temporary exception for this PUBLIC repository: standard GitHub-hosted
    # runners are free. Keep public PR code outside the shared cluster until
    # ARC repository eligibility and isolation are explicitly verified.
    # Restore ARC after that proof; do not widen the organization runner group.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run buildmap
